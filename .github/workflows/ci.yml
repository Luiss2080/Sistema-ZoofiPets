name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: PHP lint + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli

      - name: Lint every PHP file (php -l)
        run: |
          set -e
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /tmp/lint_output.txt 2>&1; then
              echo "::error file=$file::Syntax error"
              cat /tmp/lint_output.txt
              failed=1
            fi
          done < <(find . -name "*.php" -not -path "./vendor/*" -print0)
          exit $failed

      - name: Run test suite
        run: php tests/run.php
