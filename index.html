<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Login Layer -->
    <div class="login-container">
        <!-- LOGO -->
        <div class="logo">
            <img src="Assets/LOGO1.png" alt="Logo de CODECRAFT">
            <div class="animated-bar"></div>
        </div>
        <!-- TÍTULO -->
        <h2>ZOOFIPETSS</h2>
        <p>Inicio de Sesión</p>
        <!-- FORMULARIO -->
        <form onsubmit="event.preventDefault(); login();">
            <input type="text" id="username" placeholder="Ingrese su usuario" required>
            <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <!-- OPCIONES ADICIONALES -->
        <div style="height: 20px;"></div>
        <a href="#" class="recover-password">Solicitar recuperar contraseña</a>
        <p class="version">Versión 4.1.0.6</p>
    </div>

    <script>
        // Verificar si ya hay una sesión de SERVIDOR activa (no basta con
        // localStorage: eso solo lo lee/escribe el propio navegador y
        // nunca fue verificado contra la base de datos).
        window.onload = async function() {
            try {
                const res = await fetch('Logica_PHP/Sesion.php', { credentials: 'same-origin' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.autenticado) {
                        window.location.href = 'capa_proforma.html';
                    }
                }
            } catch (e) {
                // Sin conexión al servidor: se queda en la pantalla de login
            }
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Por favor ingrese usuario y contraseña');
                return;
            }

            const boton = document.querySelector('.login-container button[type="submit"]');
            if (boton) boton.disabled = true;

            try {
                const formData = new FormData();
                formData.append('usuario', username);
                formData.append('password', password);

                const res = await fetch('Logica_PHP/Login.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: formData
                });
                const data = await res.json();

                if (data.exito) {
                    // La sesión real vive en la cookie de PHP (verificada en
                    // cada endpoint con requireAuth()). Este flag y el nombre
                    // solo se usan para que las demás pantallas del panel
                    // muestren/oculten sus capas de UI sin volver a preguntar.
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('username', data.usuario.nombre);
                    window.location.href = 'capa_proforma.html';
                } else {
                    alert(data.mensaje || 'Usuario o contraseña incorrectos');
                }
            } catch (e) {
                alert('No se pudo contactar al servidor. Intente nuevamente.');
            } finally {
                if (boton) boton.disabled = false;
            }
        }

        async function logout() {
            try {
                await fetch('Logica_PHP/Logout.php', { credentials: 'same-origin' });
            } catch (e) {
                // Si el servidor no responde, igual se limpia el estado local
            }
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            window.location.href = window.location.origin + '/index.html';

            // Borrar el usuario y contraseña del campo de texto
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
   </script>
</body>
</html>
